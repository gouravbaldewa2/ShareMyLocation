name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_map: ^8.2.2
  geolocator: ^14.0.2
  go_router: ^17.1.0
  hooks_riverpod: ^3.2.1
  http: ^1.6.0
  latlong2: ^0.9.1
  play_install_referrer: ^0.5.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
